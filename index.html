<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paleta de colores</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>🎨 Paleta de colores</h1>
      <p>Genera una combinación inspiradora y armónica para tus proyectos o trabajos.</p>
    </header>

    <main>
      <!-- Controles -->
      <section class="controles" style="border: 1px solid rgb(199, 189, 189); padding: 10px; margin: 10px">
        <label for="select-cantidad">Cantidad de colores:</label>
        <select id="select-cantidad">
          <option value="6">6 colores</option>
          <option value="8">8 colores</option>
          <option value="9">9 colores</option>
        </select>

        <label for="select-formato">Formato de código:</label>
        <select id="select-formato">
          <option value="hex">HEX</option>
          <option value="hsl">HSL</option>
        </select>

        <button id="btn-generar">GENERAR PALETA</button>
          </section> 
    
      <!-- Contenedor donde se ven los colores principales -->
      <div class="paleta-grid" id="paleta-grid"></div>

   
    </main>

    <!-- Notificación visual -->
    <div id="toast" class="toast">¡Código copiado!</div>

    <!-- Pie de página (Footer) -->

    <footer>
      <p> © 2026 | Estefania Valbuena Rincon </p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
